<meta name="claude:viewport-fit-sides" content="cover">
<title>Rally Draw</title>
<style>
/* ────────────────────────────────────────────────────────────
   Layout concept: a vertical "scorecard" wizard — one tab strip
   styled like a tournament scoreboard, one working panel below.
   Generated matches render as stacked court cards, each row
   reading left-to-right like a draw sheet pinned to a clipboard.
   ──────────────────────────────────────────────────────────── */
:root{
  --bg:#F6F4EC;
  --surface:#FFFFFF;
  --surface-2:#EFEBDF;
  --ink:#16261F;
  --ink-soft:#54645C;
  --court:#1F6F62;
  --court-dark:#133E36;
  --ball:#C9E24E;
  --ball-ink:#2B3309;
  --line:#DAD3C1;
  --danger:#B5432F;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A17;
    --surface:#15271F;
    --surface-2:#1C322A;
    --ink:#ECEEE3;
    --ink-soft:#A6B8AF;
    --court:#52B49C;
    --court-dark:#2C5A4E;
    --ball:#D7EE6C;
    --ball-ink:#20280A;
    --line:#2A3D34;
    --danger:#E6826A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A17;
  --surface:#15271F;
  --surface-2:#1C322A;
  --ink:#ECEEE3;
  --ink-soft:#A6B8AF;
  --court:#52B49C;
  --court-dark:#2C5A4E;
  --ball:#D7EE6C;
  --ball-ink:#20280A;
  --line:#2A3D34;
  --danger:#E6826A;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Work Sans",system-ui,-apple-system,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:28px 60px;
}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:720px;margin:0 auto}

/* header */
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--ball);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark svg{width:16px;height:16px}
.brand h1{font-size:1.4rem;color:var(--ink)}
.brand span{display:block;font-size:0.72rem;color:var(--ink-soft);font-weight:500;letter-spacing:0.04em;text-transform:uppercase;margin-top:1px}
.theme-note{font-size:0.72rem;color:var(--ink-soft)}

/* cloud / share status */
.cloud-badge{display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:0.03em}
.cloud-badge.online{background:color-mix(in srgb, var(--court) 20%, var(--surface-2));color:var(--court)}
.cloud-badge.offline{background:var(--surface-2);color:var(--ink-soft)}
.cloud-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.share-box{background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.share-box .link-field{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:0.78rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-box .label{font-size:0.78rem;color:var(--ink-soft);flex:0 0 100%}
.publish-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.publish-row .status-text{font-size:0.78rem;color:var(--ink-soft)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* step strip */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-btn{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:9px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-soft);font-size:0.82rem;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
}
.step-btn .num{
  width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-family:"IBM Plex Mono",monospace;flex-shrink:0;
}
.step-btn.active{background:var(--court);border-color:var(--court);color:#fff}
.step-btn.active .num{background:rgba(255,255,255,.22);color:#fff}
.step-btn.done .num{background:var(--court);color:#fff}
.step-btn:focus-visible{outline:2px solid var(--court);outline-offset:2px}

/* card */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:3px}
.panel .sub{color:var(--ink-soft);font-size:0.85rem;margin-bottom:18px}

/* form */
.field{margin-bottom:15px}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.01em}
.field input[type=text],.field input[type=date],.field input[type=number],.field select{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:0.92rem;font-family:inherit;
}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--court);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}

/* format picker */
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.fmt-grid{grid-template-columns:1fr}}
.fmt-card{
  border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;background:var(--bg);
  text-align:left;color:var(--ink);transition:border-color .15s,background .15s;
}
.fmt-card strong{display:block;font-size:0.9rem;margin-bottom:3px;font-family:"Archivo",sans-serif;font-weight:700}
.fmt-card span{font-size:0.78rem;color:var(--ink-soft);line-height:1.4}
.fmt-card.active{border-color:var(--court);background:color-mix(in srgb, var(--court) 10%, var(--bg))}
.fmt-card:focus-visible{outline:2px solid var(--court);outline-offset:2px}

/* participant list */
.add-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.add-row input,.add-row select{flex:1;min-width:120px}
.btn{
  border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:0.86rem;cursor:pointer;
  font-family:"Work Sans",sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-primary{background:var(--court);color:#fff}
.btn-primary:hover{background:var(--court-dark)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-ball{background:var(--ball);color:var(--ball-ink)}
.btn-sm{padding:6px 11px;font-size:0.78rem;border-radius:8px}
.btn:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pair-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pair-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);
}
.pair-item .names{font-weight:600;font-size:0.88rem}
.pair-item .cat{font-size:0.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px}
.pair-item button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.78rem;font-weight:600;padding:4px 6px}
.empty{color:var(--ink-soft);font-size:0.85rem;padding:18px 0;text-align:center}

/* team roster builder */
.team-card{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px;background:var(--bg)}
.team-card .team-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.team-card .team-head strong{font-size:0.94rem;font-family:"Archivo",sans-serif}
.team-card .team-head button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.78rem;font-weight:600}
.roster-chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.roster-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:0.8rem;font-weight:600}
.roster-chip button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.82rem;padding:0;line-height:1}
.mini-add-row{display:flex;gap:6px}
.mini-add-row input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:0.82rem;font-family:inherit}

/* scoring */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .t-label{font-size:0.88rem;font-weight:600}
.toggle-row .t-desc{font-size:0.76rem;color:var(--ink-soft);margin-top:2px}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch .thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked ~ .track{background:var(--court)}
.switch input:checked ~ .thumb{transform:translateX(18px)}

/* schedule output */
.sched-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:0.8rem;color:var(--ink-soft)}
.sched-meta b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.round-block{margin-bottom:20px}
.round-title{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.round-title .chip{background:var(--court);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:0.72rem;padding:3px 9px;border-radius:999px;font-weight:600}
.round-title h3{font-size:0.98rem}
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.match-card{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
.match-card .court-tag{font-size:0.68rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.match-card .court-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ball)}
.vs-line{display:flex;align-items:flex-start;gap:8px;font-size:0.85rem;font-weight:600}
.vs-line > div{flex:1;min-width:0}
.vs-line .vs{font-family:"IBM Plex Mono",monospace;color:var(--ink-soft);font-size:0.7rem;font-weight:500;flex:0 0 auto;margin-top:2px}
.bye-card{border-style:dashed;color:var(--ink-soft);font-size:0.8rem;display:flex;align-items:center;justify-content:center}
.rest-note{font-size:0.72rem;color:var(--ink-soft);margin-top:8px}

.note-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:0.82rem;color:var(--ink-soft);line-height:1.5;margin-bottom:16px}
.note-box b{color:var(--ink)}

/* score entry inside match cards */
.score-edit-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.score-input{
  width:40px;flex:0 0 auto;text-align:center;padding:6px 2px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:0.9rem;font-family:"IBM Plex Mono",monospace;font-weight:600;
  -moz-appearance:textfield;
}
.score-input::-webkit-outer-spin-button,.score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score-input:focus-visible{outline:2px solid var(--court);outline-offset:1px}
.score-sep{color:var(--ink-soft);font-size:0.8rem;flex:0 0 auto}
.match-card.has-result{border-color:color-mix(in srgb, var(--court) 45%, var(--line))}
.score-view{display:flex;align-items:center;gap:9px}
.score-num{font-family:"IBM Plex Mono",monospace;font-size:1.35rem;font-weight:700;color:var(--ink-soft)}
.score-num.win{color:var(--court)}

/* standings table */
.standings-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.standings-table{width:100%;border-collapse:collapse;min-width:480px;font-size:0.85rem}
.standings-table th{
  text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);
  font-weight:700;padding:10px 12px;background:var(--surface-2);white-space:nowrap;
}
.standings-table th.num,.standings-table td.num{text-align:center}
.standings-table td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.standings-table td.pair-cell{white-space:normal;font-weight:600}
.standings-table tr:first-child td{border-top:none}
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  font-family:"IBM Plex Mono",monospace;font-size:0.76rem;font-weight:700;background:var(--surface-2);color:var(--ink-soft);
}
.rank-badge.r1{background:var(--ball);color:var(--ball-ink)}
.rank-badge.r2{background:color-mix(in srgb, var(--court) 28%, var(--surface-2));color:var(--ink)}
.rank-badge.r3{background:color-mix(in srgb, var(--court) 14%, var(--surface-2));color:var(--ink)}
.diff-pos{color:var(--court)}
.diff-neg{color:var(--danger)}
.group-heading{font-size:1rem;margin:20px 0 9px}
.group-heading:first-child{margin-top:0}

/* nav */
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.sample-tag{display:inline-block;background:var(--ball);color:var(--ball-ink);font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
footer{text-align:center;font-size:0.72rem;color:var(--ink-soft);margin-top:30px}
</style>

  // ---------- scheduling engine ----------

  function teamLabel(t){
    if (!t) return "?";
    if (t.p1 !== undefined) return t.p1 + "/" + t.p2;
    if (t.label !== undefined) return t.label;
    if (t.name !== undefined) return t.name;
    return "?";
  }

  function pairEntity(p1, p2){
    return {id: "p" + p1.id + "-" + p2.id, label: p1.name + " / " + p2.name, memberIds: [p1.id, p2.id]};
  }

  // Round-robin via circle method, teams assigned to courts cyclically per round.
  function roundRobinRounds(teams){
    var list = teams.slice();
    var bye = null;
    if (list.length % 2 === 1){ bye = {id:"bye", p1:"—", p2:"", cat:""}; list.push(bye); }
    var n = list.length;
    var rounds = [];
    var arr = list.slice();
    for (var r = 0; r < n - 1; r++){
      var pairs = [];
      for (var i = 0; i < n/2; i++){
        var a = arr[i], b = arr[n-1-i];
        pairs.push([a,b]);
      }
      rounds.push(pairs);
      // rotate, keep first fixed
      var fixed = arr[0];
      var rest = arr.slice(1);
      rest.unshift(rest.pop());
      arr = [fixed].concat(rest);
    }
    return rounds;
  }

  function assignCourts(pairs, courts, roundLabel){
    // returns array of {court, a, b, id} dropping/flagging byes, cycling courts, queuing overflow into session groups
    var real = pairs.filter(function(pr){ return pr[0].id !== "bye" && pr[1].id !== "bye"; });
    var byeTeam = null;
    pairs.forEach(function(pr){
      if (pr[0].id === "bye") byeTeam = pr[1];
      if (pr[1].id === "bye") byeTeam = pr[0];
    });
    var sessions = [];
    for (var i = 0; i < real.length; i += courts){
      var chunk = real.slice(i, i + courts).map(function(pr, idx){
        var mid = (roundLabel || "r") + ":" + [pr[0].id, pr[1].id].sort().join("-");
        return {court: idx+1, a: pr[0], b: pr[1], id: mid};
      });
      sessions.push(chunk);
    }
    if (sessions.length === 0) sessions.push([]);
    return {sessions: sessions, bye: byeTeam};
  }

  function flattenMatches(sessions){
    var out = [];
    sessions.forEach(function(s){ s.forEach(function(m){ out.push(m); }); });
    return out;
  }

  function buildKnockout(teams){
    var list = teams.slice();
    // simple shuffle-free seed order as entered
    var size = 1;
    while (size < list.length) size *= 2;
    while (list.length < size) list.push({id:"bye", p1:"BYE", p2:"", cat:""});
    var rounds = [];
    var roundNames = function(remaining){
      if (remaining === 2) return "Final";
      if (remaining === 4) return "Semifinal";
      if (remaining === 8) return "Perempat Final";
      return "Babak " + Math.round(size/remaining);
    };
    var current = list;
    while (current.length >= 2){
      var pairs = [];
      for (var i = 0; i < current.length; i += 2){
        pairs.push([current[i], current[i+1]]);
      }
      rounds.push({name: roundNames(current.length), pairs: pairs});
      current = pairs.map(function(){ return {id:"tbd", p1:"Pemenang", p2:"", cat:""}; });
    }
    return rounds;
  }

  function buildGroups(teams, groupSize){
    var groups = [];
    var list = teams.slice();
    var count = Math.max(1, Math.ceil(list.length / groupSize));
    for (var i = 0; i < count; i++) groups.push([]);
    list.forEach(function(t, idx){ groups[idx % count].push(t); });
    return groups;
  }

  // ---- Americano: random partner rotation each round, individual scoring ----
  function buildAmericanoSchedule(players, roundsCount, courts){
    var activeCount = Math.min(Math.floor(players.length / 4) * 4, courts * 4);
    if (activeCount < 4) return {error:"need4players"};
    var rounds = [];
    var usedPairs = {};
    for (var r = 0; r < roundsCount; r++){
      var benchSize = players.length - activeCount;
      var order = players.slice();
      if (benchSize > 0){
        var off = (r * benchSize) % players.length;
        order = order.slice(off).concat(order.slice(0, off));
      }
      var active = order.slice(0, activeCount);
      var bench = order.slice(activeCount);

      var pairsThisRound = null;
      for (var attempt = 0; attempt < 30; attempt++){
        var shuffled = shuffle(active);
        var candidate = [];
        var ok = true;
        for (var i = 0; i < shuffled.length; i += 2){
          var key = [shuffled[i].id, shuffled[i+1].id].sort().join("-");
          if (usedPairs[key] && attempt < 25){ ok = false; break; }
          candidate.push([shuffled[i], shuffled[i+1]]);
        }
        if (ok){ pairsThisRound = candidate; break; }
      }
      if (!pairsThisRound){
        var shuffled2 = shuffle(active);
        pairsThisRound = [];
        for (var k = 0; k < shuffled2.length; k += 2) pairsThisRound.push([shuffled2[k], shuffled2[k+1]]);
      }
      pairsThisRound.forEach(function(pr){ usedPairs[[pr[0].id, pr[1].id].sort().join("-")] = true; });

      var sideTeams = pairsThisRound.map(function(pr){ return pairEntity(pr[0], pr[1]); });
      var matches = [];
      for (var m = 0; m < sideTeams.length - 1; m += 2){
        var mid = "amer-r" + (r+1) + ":" + sideTeams[m].id + "-" + sideTeams[m+1].id;
        matches.push({court: matches.length + 1, a: sideTeams[m], b: sideTeams[m+1], id: mid});
      }
      rounds.push({
        label: "Babak " + (r+1),
        sessions: [matches],
        bye: null,
        restNote: bench.length ? bench.map(function(pl){ return pl.name; }).join(", ") : null
      });
    }
    var allMatches = [];
    rounds.forEach(function(rr){ allMatches = allMatches.concat(flattenMatches(rr.sessions)); });
    return {type:"americano", rounds: rounds, players: players, matches: allMatches};
  }

  // ---- Mexicano / Mixed Americano: standings-based re-pairing, generated one round at a time ----
  function buildMexicanoRound(players, roundIndex, courts, priorMatches, isFirstRound, genderConstrained){
    var activeCount = Math.min(Math.floor(players.length / 4) * 4, courts * 4);
    var orderedPlayers;
    if (isFirstRound){
      orderedPlayers = shuffle(players);
    } else {
      orderedPlayers = computeIndividualStandings(players, priorMatches).map(function(row){ return row.player; });
    }

    var matches = [];
    var bench = [];

    if (!genderConstrained){
      var active = orderedPlayers.slice(0, activeCount);
      bench = orderedPlayers.slice(activeCount);
      for (var i = 0; i + 3 < active.length + 1 && i + 3 < active.length; i += 4){
        var grp = active.slice(i, i+4);
        if (grp.length < 4) break;
        var teamTop = pairEntity(grp[0], grp[1]);
        var teamBottom = pairEntity(grp[2], grp[3]);
        var mid = "mex-r" + (roundIndex+1) + ":" + teamTop.id + "-" + teamBottom.id;
        matches.push({court: matches.length + 1, a: teamTop, b: teamBottom, id: mid});
      }
    } else {
      var men = orderedPlayers.filter(function(pl){ return pl.gender === "L"; });
      var women = orderedPlayers.filter(function(pl){ return pl.gender === "P"; });
      var teamCountMax = Math.min(Math.floor(men.length), Math.floor(women.length));
      var teamCount = Math.min(teamCountMax, Math.floor(activeCount / 2));
      var teamsArr = [];
      for (var k = 0; k < teamCount; k++) teamsArr.push(pairEntity(men[k], women[k]));
      for (var t = 0; t + 1 < teamsArr.length; t += 2){
        var mid2 = "mix-r" + (roundIndex+1) + ":" + teamsArr[t].id + "-" + teamsArr[t+1].id;
        matches.push({court: matches.length + 1, a: teamsArr[t], b: teamsArr[t+1], id: mid2});
      }
      var usedIds = {};
      teamsArr.forEach(function(te){ te.memberIds.forEach(function(id){ usedIds[id] = true; }); });
      bench = orderedPlayers.filter(function(pl){ return !usedIds[pl.id]; });
    }

    return {
      label: "Babak " + (roundIndex+1),
      sessions: [matches],
      bye: null,
      restNote: bench.length ? bench.map(function(pl){ return pl.name; }).join(", ") : null
    };
  }

  // ---- Custom Team: round-robin between teams, rotating internal roster pairing ----
  function rosterPairFor(team, roundIdx){
    var roster = team.roster;
    if (roster.length < 2) return {label: "-"};
    var start = (roundIdx * 2) % roster.length;
    var p1 = roster[start], p2 = roster[(start+1) % roster.length];
    return {label: p1.name + " & " + p2.name};
  }

  function assignCourtsTeam(pairs, courts, roundIdx){
    var real = pairs.filter(function(pr){ return pr[0].id !== "bye" && pr[1].id !== "bye"; });
    var byeTeam = null;
    pairs.forEach(function(pr){
      if (pr[0].id === "bye") byeTeam = pr[1];
      if (pr[1].id === "bye") byeTeam = pr[0];
    });
    var matches = [];
    real.forEach(function(pr){
      var teamA = pr[0], teamB = pr[1];
      var rpA = rosterPairFor(teamA, roundIdx);
      var rpB = rosterPairFor(teamB, roundIdx);
      var mid = "team-r" + (roundIdx+1) + ":" + [teamA.id, teamB.id].sort().join("-");
      matches.push({court: (matches.length % courts) + 1, a: teamA, b: teamB, id: mid, aPairLabel: rpA.label, bPairLabel: rpB.label});
    });
    return {matches: matches, bye: byeTeam};
  }

  function buildCustomTeamSchedule(teams, courts){
    if (teams.length < 2) return {error:"need2teams"};
    var badRoster = teams.some(function(t){ return t.roster.length < 2; });
    if (badRoster) return {error:"roster2"};
    var rrRounds = roundRobinRounds(teams);
    var rounds = rrRounds.map(function(pairs, ri){
      var out = assignCourtsTeam(pairs, courts, ri);
      return {label: "Babak " + (ri+1), sessions: [out.matches], bye: out.bye};
    });
    var allMatches = [];
    rounds.forEach(function(r){ allMatches = allMatches.concat(flattenMatches(r.sessions)); });
    return {type:"custom_team", rounds: rounds, teams: teams, matches: allMatches};
  }

  function buildSchedule(){
    var fmt = FORMATS[state.format];
    var unit = fmt.unit;
    var courts = state.info.courts;

    if (unit === "pair"){
      var teams = state.participants.slice();
      if (teams.length < 2) return {error:"need2"};

      if (state.format === "round_robin"){
        var rounds = roundRobinRounds(teams);
        var rrRounds = rounds.map(function(pairs, i){
          var out = assignCourts(pairs, courts, "rr-r" + (i+1));
          return {label:"Babak " + (i+1), sessions: out.sessions, bye: out.bye};
        });
        var rrMatches = [];
        rrRounds.forEach(function(r){ rrMatches = rrMatches.concat(flattenMatches(r.sessions)); });
        return {type:"round_robin", rounds: rrRounds, teams: teams, matches: rrMatches};
      }

      if (state.format === "knockout"){
        var kr = buildKnockout(teams);
        return {type:"knockout", rounds: kr};
      }

      if (state.format === "groups_knockout"){
        var groups = buildGroups(teams, 4);
        var groupData = groups.map(function(g, gi){
          var rounds2 = roundRobinRounds(g);
          var gRounds = rounds2.map(function(pairs, i){
            var out = assignCourts(pairs, courts, "g" + gi + "-r" + (i+1));
            return {label:"Babak " + (i+1), sessions: out.sessions, bye: out.bye};
          });
          var gMatches = [];
          gRounds.forEach(function(r){ gMatches = gMatches.concat(flattenMatches(r.sessions)); });
          return {
            name: "Grup " + String.fromCharCode(65+gi),
            teams: g,
            rounds: gRounds,
            matches: gMatches
          };
        });
        return {type:"groups_knockout", groups: groupData};
      }

      return {error:"unknown"};
    }

    if (unit === "individual"){
      var players = state.players.slice();
      if (players.length < 4) return {error:"need4players"};

      if (state.format === "americano"){
        return buildAmericanoSchedule(players, Math.max(1, state.roundsCount || 4), courts);
      }

      if (state.format === "mexicano" || state.format === "mixed_americano"){
        var genderC = !!fmt.mixedGender;
        if (genderC){
          var menCount = players.filter(function(pl){ return pl.gender === "L"; }).length;
          var womenCount = players.filter(function(pl){ return pl.gender === "P"; }).length;
          if (menCount < 2 || womenCount < 2) return {error:"needgender"};
        }
        var round1 = buildMexicanoRound(players, 0, courts, [], true, genderC);
        return {type: state.format, rounds: [round1], players: players, matches: flattenMatches(round1.sessions)};
      }

      return {error:"unknown"};
    }

    if (unit === "team"){
      return buildCustomTeamSchedule(state.teams.slice(), courts);
    }

    return {error:"unknown"};
  }

  function generateNextDynamicRound(){
    if (state.readOnly) return;
    var s = state.schedule;
    if (!s || !s.rounds) return;
    var genderC = !!FORMATS[state.format].mixedGender;
    var allMatches = [];
    s.rounds.forEach(function(r){ allMatches = allMatches.concat(flattenMatches(r.sessions)); });
    var nextRound = buildMexicanoRound(s.players, s.rounds.length, state.info.courts, allMatches, false, genderC);
    s.rounds.push(nextRound);
    s.matches = s.matches.concat(flattenMatches(nextRound.sessions));
    state.champBracket = null;
    renderAll();
  }

  function matchScored(m){
    var sc = state.scores[m.id];
    return !!(sc && sc.a !== undefined && sc.a !== "" && sc.b !== undefined && sc.b !== "");
  }

  function roundFullyScored(round){
    var matches = flattenMatches(round.sessions);
    if (matches.length === 0) return false;
    return matches.every(matchScored);
  }

  function commitScore(matchId, aVal, bVal){
    if (state.readOnly) return; // defensive: view-only links never show the controls that call this
    var a = (aVal === "" || aVal === undefined) ? "" : String(parseInt(aVal, 10));
    var b = (bVal === "" || bVal === undefined) ? "" : String(parseInt(bVal, 10));
    if (a === "NaN") a = "";
    if (b === "NaN") b = "";
    state.scores[matchId] = {a: a, b: b};
    state.editingMatch = null;
    if (state.cloud && state.cloud.tournamentId && state.cloud.editToken && sb){
      sb.rpc("update_match_score", {
        p_match_id: matchId,
        p_edit_token: state.cloud.editToken,
        p_score_a: a === "" ? null : parseInt(a, 10),
        p_score_b: b === "" ? null : parseInt(b, 10)
      }).then(function(res){
        if (res.error) console.warn("Gagal menyimpan skor ke server:", res.error.message);
      });
    }
    renderAll();
  }

  // ---------- standings ----------

  function computeStandings(teams, matches){
    var table = {};
    teams.forEach(function(t){
      if (t.id === "bye") return;
      table[t.id] = {team:t, played:0, win:0, loss:0, tie:0, gf:0, ga:0};
    });
    (matches || []).forEach(function(m){
      var sc = state.scores[m.id];
      if (!sc || sc.a === undefined || sc.b === undefined || sc.a === "" || sc.b === "") return;
      var sa = parseInt(sc.a, 10), sbv = parseInt(sc.b, 10);
      if (isNaN(sa) || isNaN(sbv)) return;
      var ra = table[m.a.id], rb = table[m.b.id];
      if (!ra || !rb) return;
      ra.played++; rb.played++;
      ra.gf += sa; ra.ga += sbv;
      rb.gf += sbv; rb.ga += sa;
      if (sa > sbv){ ra.win++; rb.loss++; }
      else if (sbv > sa){ rb.win++; ra.loss++; }
      else { ra.tie++; rb.tie++; }
    });
    var rows = Object.keys(table).map(function(k){ return table[k]; });
    rows.sort(function(x, y){
      if (y.win !== x.win) return y.win - x.win;
      var dx = x.gf - x.ga, dy = y.gf - y.ga;
      if (dy !== dx) return dy - dx;
      return y.gf - x.gf;
    });
    return rows;
  }

  function computeIndividualStandings(players, matches){
    var table = {};
    players.forEach(function(pl){ table[pl.id] = {player: pl, played:0, win:0, loss:0, tie:0, gf:0, ga:0}; });
    (matches || []).forEach(function(m){
      var sc = state.scores[m.id];
      if (!sc || sc.a === undefined || sc.b === undefined || sc.a === "" || sc.b === "") return;
      var sa = parseInt(sc.a, 10), sbv = parseInt(sc.b, 10);
      if (isNaN(sa) || isNaN(sbv)) return;
      var aWin = sa > sbv, bWin = sbv > sa;
      [[m.a, true], [m.b, false]].forEach(function(pair){
        var side = pair[0], isA = pair[1];
        (side.memberIds || []).forEach(function(pid){
          var row = table[pid];
          if (!row) return;
          row.played++;
          row.gf += isA ? sa : sbv;
          row.ga += isA ? sbv : sa;
          if (isA ? aWin : bWin) row.win++;
          else if (isA ? bWin : aWin) row.loss++;
          else row.tie++;
        });
      });
    });
    var rows = Object.keys(table).map(function(k){ return table[k]; });
    rows.sort(function(x, y){
      if (y.win !== x.win) return y.win - x.win;
      var dx = x.gf - x.ga, dy = y.gf - y.ga;
      if (dy !== dx) return dy - dx;
      return y.gf - x.gf;
    });
    return rows;
  }

  function standingsTable(teams, matches){
    var rows = computeStandings(teams, matches);
    var wrap = el("div", {class:"standings-wrap"});
    var table = el("table", {class:"standings-table"});

    rows.forEach(function(r, i){
      var rankCls = "rank-badge" + (i === 0 ? " r1" : i === 1 ? " r2" : i === 2 ? " r3" : "");
      var diff = r.gf - r.ga;
      var diffCls = diff > 0 ? "diff-pos" : diff < 0 ? "diff-neg" : "";
      var diffText = (diff > 0 ? "+" : "") + diff;
      tbody.appendChild(el("tr", {}, [

        el("td", {class:"num mono"}, [String(r.played)]),
        el("td", {class:"num mono"}, [r.win + "-" + r.loss]),
        el("td", {class:"num mono"}, [r.gf + ":" + r.ga]),
        el("td", {class:"num mono " + diffCls}, [diffText])
      ]));
    });
    if (rows.length === 0){
      tbody.appendChild(el("tr", {}, [el("td", {colspan:"6", class:"empty"}, ["Belum ada pasangan."])]));
    }
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function individualStandingsTable(players, matches){
    var rows = computeIndividualStandings(players, matches);
    var wrap = el("div", {class:"standings-wrap"});
    var table = el("table", {class:"standings-table"});
    var thead = el("thead", {}, [
      el("tr", {}, [
        el("th", {class:"num"}, ["#"]),
        el("th", {}, ["Pemain"]),
        el("th", {class:"num"}, ["Main"]),
        el("th", {class:"num"}, ["M-K"]),
        el("th", {class:"num"}, ["Poin"]),
        el("th", {class:"num"}, ["Selisih"])
      ])
    ]);
    var tbody = el("tbody");
    rows.forEach(function(r, i){
      var rankCls = "rank-badge" + (i === 0 ? " r1" : i === 1 ? " r2" : i === 2 ? " r3" : "");
      var diff = r.gf - r.ga;
      var diffCls = diff > 0 ? "diff-pos" : diff < 0 ? "diff-neg" : "";
      var diffText = (diff > 0 ? "+" : "") + diff;
      tbody.appendChild(el("tr", {}, [
        el("td", {class:"num"}, [el("span", {class:rankCls}, [String(i+1)])]),
        el("td", {class:"pair-cell"}, [r.player.name]),
        el("td", {class:"num mono"}, [String(r.played)]),
        el("td", {class:"num mono"}, [r.win + "-" + r.loss]),
        el("td", {class:"num mono"}, [String(r.gf)]),
        el("td", {class:"num mono " + diffCls}, [diffText])
      ]));
    });
    if (rows.length === 0){
      tbody.appendChild(el("tr", {}, [el("td", {colspan:"6", class:"empty"}, ["Belum ada pemain."])]));
    }
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  // ---------- bagan juara (dibuat dari klasemen) ----------

  function baseStageComplete(s){
    if (s.type === "round_robin" || s.type === "custom_team" || s.type === "americano"){
      return s.matches.length > 0 && s.matches.every(matchScored);
    }
    if (s.type === "groups_knockout"){
      var all = [];
      s.groups.forEach(function(g){ all = all.concat(g.matches); });
      return all.length > 0 && all.every(matchScored);
    }
    if (s.type === "mexicano" || s.type === "mixed_americano"){
      return roundFullyScored(s.rounds[s.rounds.length - 1]);
    }
    return false;
  }

  function getChampionshipEntities(s){
    if (s.type === "round_robin" || s.type === "custom_team"){
      var rows = computeStandings(s.teams, s.matches);
      if (rows.length < 4) return {error:"Butuh minimal 4 pasangan/tim dengan hasil pertandingan untuk membuat bagan juara."};
      return {entities: rows.slice(0, 4).map(function(r){ return r.team; })};
    }
    if (s.type === "americano" || s.type === "mexicano" || s.type === "mixed_americano"){
      var irows = computeIndividualStandings(s.players, s.matches);
      if (irows.length < 8) return {error:"Butuh minimal 8 pemain untuk membentuk 4 pasangan di bagan juara."};
      var top = irows.slice(0, 8).map(function(r){ return r.player; });
      return {entities: [
        pairEntity(top[0], top[7]),
        pairEntity(top[1], top[6]),
        pairEntity(top[2], top[5]),
        pairEntity(top[3], top[4])
      ]};
    }
    if (s.type === "groups_knockout"){
      var groupRows = s.groups.map(function(g){ return {name: g.name, rows: computeStandings(g.teams, g.matches)}; });
      var list = [];
      groupRows.forEach(function(g){ if (g.rows[0]) list.push(g.rows[0].team); });
      if (list.length < 4){
        groupRows.forEach(function(g){ if (g.rows[1]) list.push(g.rows[1].team); });
      }
      list = list.slice(0, 4);
      if (list.length < 4) return {error:"Butuh minimal 4 pasangan juara/runner-up grup untuk membuat bagan juara."};
      return {entities: list};
    }
    return {error:"Format ini tidak mendukung bagan juara."};
  }

  function champSupportsCloud(){
    return !!(state.cloud && state.cloud.tournamentId && sb && (state.format === "round_robin" || state.format === "groups_knockout"));
  }

  function buildChampionshipBracket(){
    if (state.readOnly) return;
    var s = state.schedule;
    if (!s) return;
    var res = getChampionshipEntities(s);
    if (res.error) return;
    var entities = res.entities;
    var cb = {
      entities: entities,
      sf: [
        {court:1, a: entities[0], b: entities[3], id:"champ-sf1"},
        {court:2, a: entities[1], b: entities[2], id:"champ-sf2"}
      ],
      final: null,
      third: null
    };
    state.champBracket = cb;
    renderAll();

    if (champSupportsCloud()){
      var payload = cb.sf.map(function(m){
        return {
          tournament_id: state.cloud.tournamentId,
          group_name: null,
          round_label: m.id,
          court: m.court,
          team_a_id: m.a.id,
          team_b_id: m.b.id,
          score_a: null,
          score_b: null
        };
      });
      sb.from("matches").insert(payload).select().then(function(res2){
        if (res2.error){ console.warn("Gagal menyimpan bagan juara ke server:", res2.error.message); return; }
        res2.data.forEach(function(row, i){ cb.sf[i].id = row.id; });
        renderAll();
      });
    }
  }

  function buildChampFinal(){
    if (state.readOnly) return;
    var cb = state.champBracket;
    if (!cb || cb.final) return;
    if (!matchScored(cb.sf[0]) || !matchScored(cb.sf[1])) return;
    var sc1 = state.scores[cb.sf[0].id], sc2 = state.scores[cb.sf[1].id];
    var a1 = parseInt(sc1.a, 10), b1 = parseInt(sc1.b, 10);
    var a2 = parseInt(sc2.a, 10), b2 = parseInt(sc2.b, 10);
    var w1 = a1 > b1 ? cb.sf[0].a : cb.sf[0].b, l1 = a1 > b1 ? cb.sf[0].b : cb.sf[0].a;
    var w2 = a2 > b2 ? cb.sf[1].a : cb.sf[1].b, l2 = a2 > b2 ? cb.sf[1].b : cb.sf[1].a;
    cb.final = {court:1, a:w1, b:w2, id:"champ-final"};
    cb.third = {court:2, a:l1, b:l2, id:"champ-3rd"};
    renderAll();

    if (champSupportsCloud()){
      var payload = [cb.final, cb.third].map(function(m){
        return {
          tournament_id: state.cloud.tournamentId,
          group_name: null,
          round_label: m.id,
          court: m.court,
          team_a_id: m.a.id,
          team_b_id: m.b.id,
          score_a: null,
          score_b: null
        };
      });
      sb.from("matches").insert(payload).select().then(function(res2){
        if (res2.error){ console.warn("Gagal menyimpan final/juara 3 ke server:", res2.error.message); return; }
        cb.final.id = res2.data[0].id;
        cb.third.id = res2.data[1].id;
        renderAll();
      });
    }
  }

  function podiumBlock(cb){
    var fsc = state.scores[cb.final.id], tsc = state.scores[cb.third.id];
    var fa = parseInt(fsc.a, 10), fb = parseInt(fsc.b, 10);
    var champion = fa > fb ? cb.final.a : cb.final.b;
    var runnerUp = fa > fb ? cb.final.b : cb.final.a;
    var ta = parseInt(tsc.a, 10), tb = parseInt(tsc.b, 10);
    var third = ta > tb ? cb.third.a : cb.third.b;
    var box = el("div", {class:"note-box", style:"margin-top:4px"});
    box.appendChild(el("div", {style:"font-weight:700;margin-bottom:6px;color:var(--ink)"}, ["Hasil akhir"]));
    box.appendChild(el("div", {style:"margin-bottom:3px"}, ["🥇 Juara 1: ", el("b", {}, [teamLabel(champion)])]));
    box.appendChild(el("div", {style:"margin-bottom:3px"}, ["🥈 Juara 2: ", el("b", {}, [teamLabel(runnerUp)])]));
    box.appendChild(el("div", {}, ["🥉 Juara 3: ", el("b", {}, [teamLabel(third)])]));
    return box;
  }

  function championshipSection(s){

    var sfGrid = el("div", {class:"match-grid"});

      el("div", {class:"round-title"}, [el("span", {class:"chip"}, ["Semifinal"])]),

    ]));

    if (!matchScored(cb.sf[0]) || !matchScored(cb.sf[1])){
      wrap.appendChild(el("div", {class:"note-box"}, ["Isi skor kedua semifinal dulu untuk membuka final dan perebutan juara 3."]));
    } else if (!cb.final){
      if (!state.readOnly){
        wrap.appendChild(el("button", {class:"btn btn-ball", type:"button", onclick: buildChampFinal}, ["Buat Final & Perebutan Juara 3"]));
      } else {
        wrap.appendChild(el("div", {class:"note-box"}, ["Menunggu penyelenggara membuka babak final."]));
      }
    } else {
      var fGrid = el("div", {class:"match-grid"}, [matchCard(cb.final)]);
      wrap.appendChild(el("div", {class:"round-block"}, [
        el("div", {class:"round-title"}, [el("span", {class:"chip"}, ["Final"])]),
        fGrid
      ]));
      var tGrid = el("div", {class:"match-grid"}, [matchCard(cb.third)]);
      wrap.appendChild(el("div", {class:"round-block"}, [
        el("div", {class:"round-title"}, [el("span", {class:"chip"}, ["Perebutan Juara 3"])]),
        tGrid

      if (matchScored(cb.final) && matchScored(cb.third)){
        wrap.appendChild(podiumBlock(cb));

    }

    if (!state.readOnly && !champSupportsCloud()){
      wrap.appendChild(el("button", {class:"btn btn-ghost btn-sm", type:"button", style:"margin-top:10px", onclick:function(){
        state.champBracket = null; renderAll();
      }}, ["Buat Ulang Bagan Juara"]));

    return wrap;

  // ---------- cloud sync (Supabase) — pair-based formats only for now ----------

  function makeEditToken(){
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID().replace(/-/g, "");
    var t = "";
    for (var i = 0; i < 32; i++) t += Math.floor(Math.random() * 16).toString(16);
    return t;
  }

  function saveEditTokenLocally(tournamentId, editToken){
    try { localStorage.setItem("rallydraw_edit_" + tournamentId, editToken); } catch(e){}
  }

  function loadEditTokenLocally(tournamentId){
    try { return localStorage.getItem("rallydraw_edit_" + tournamentId); } catch(e){ return null; }
  }

  function groupBy(arr, keyFn){
    var m = {};
    arr.forEach(function(x){ var k = keyFn(x); (m[k] = m[k] || []).push(x); });
    return m;
  }

  function roundSortKey(label){
    var m = /r(\d+)$/.exec(label || "");
    return m ? parseInt(m[1], 10) : 0;
  }

  function rowsToRounds(rows, teamsById){
    var byRound = groupBy(rows, function(r){ return r.round_label; });
    var labels = Object.keys(byRound).sort(function(a, b){ return roundSortKey(a) - roundSortKey(b); });
    return labels.map(function(rl, i){
      var matches = byRound[rl].map(function(r){
        return {court: r.court, a: teamsById[r.team_a_id], b: teamsById[r.team_b_id], id: r.id};
      }).sort(function(x, y){ return x.court - y.court; });
      return {label: "Babak " + (i + 1), sessions: [matches], bye: null};
    });
  }

  function buildScheduleFromCloud(format, teams, matchesRows){
    var teamsById = {};
    teams.forEach(function(t){ teamsById[t.id] = t; });
    var withTeams = function(r){ return {court: r.court, a: teamsById[r.team_a_id], b: teamsById[r.team_b_id], id: r.id}; };

    if (format === "round_robin"){
      return {
        type: "round_robin",
        rounds: rowsToRounds(matchesRows, teamsById),
        teams: teams,
        matches: matchesRows.map(withTeams)
      };
    }
    if (format === "groups_knockout"){
      var byGroup = groupBy(matchesRows, function(r){ return r.group_name || "Grup A"; });
      var groupNames = Object.keys(byGroup).sort();
      var groups = groupNames.map(function(gn){
        var rows = byGroup[gn];
        var ids = {};
        rows.forEach(function(r){ ids[r.team_a_id] = 1; ids[r.team_b_id] = 1; });
        var groupTeams = teams.filter(function(t){ return ids[t.id]; });
        return {name: gn, teams: groupTeams, rounds: rowsToRounds(rows, teamsById), matches: rows.map(withTeams)};
      });
      return {type: "groups_knockout", groups: groups};
    }
    return {error: "unsupported"};
  }

  function setPublishStatus(status, msg){
    state.publishStatus = status;
    state.publishError = msg || "";
    renderAll();
  }

  function publishToCloud(){
    if (!sb){
      setPublishStatus("error", "Koneksi ke server belum siap. Coba muat ulang halaman.");
      return;
    }
    if (!state.schedule) state.schedule = buildSchedule();
    var s = state.schedule;
    if (s.error){
      setPublishStatus("error", "Lengkapi peserta dan buat jadwal terlebih dahulu.");
      return;
    }
    if (state.format !== "round_robin" && state.format !== "groups_knockout"){
      setPublishStatus("error", "Format " + FORMATS[state.format].name + " belum didukung untuk disimpan online.");
      return;
    }

    setPublishStatus("saving");

    var editToken = makeEditToken();

    sb.from("tournaments").insert([{
      name: state.info.name || "Turnamen Padel",
      event_date: state.info.date || null,
      location: state.info.location || null,
      courts: state.info.courts,
      format: state.format,
      scoring: state.scoring,
      edit_token: editToken
    }]).select("id, name, event_date, location, courts, format, scoring, created_at").then(function(tRes){
      if (tRes.error) throw tRes.error;
      var tournamentId = tRes.data[0].id;

      var pairsPayload = state.participants.map(function(p){
        return {tournament_id: tournamentId, player1: p.p1, player2: p.p2, category: p.cat};
      });
      return sb.from("pairs").insert(pairsPayload).select().then(function(pRes){
        if (pRes.error) throw pRes.error;
        var idMap = {};
        state.participants.forEach(function(p, i){ idMap[p.id] = pRes.data[i].id; });

        var flat = [];
        if (s.type === "round_robin"){
          s.matches.forEach(function(m){ flat.push({groupName: null, m: m}); });
        } else if (s.type === "groups_knockout"){
          s.groups.forEach(function(g){ g.matches.forEach(function(m){ flat.push({groupName: g.name, m: m}); }); });
        }

        var matchesPayload = flat.map(function(x){
          var sc = state.scores[x.m.id] || {};
          var sa = sc.a !== undefined && sc.a !== "" ? parseInt(sc.a, 10) : null;
          var sb_ = sc.b !== undefined && sc.b !== "" ? parseInt(sc.b, 10) : null;
          return {
            tournament_id: tournamentId,
            group_name: x.groupName,
            round_label: (x.m.id || "r1").split(":")[0],
            court: x.m.court,
            team_a_id: idMap[x.m.a.id],
            team_b_id: idMap[x.m.b.id],
            score_a: isNaN(sa) ? null : sa,
            score_b: isNaN(sb_) ? null : sb_
          };
        });

        return sb.from("matches").insert(matchesPayload).select().then(function(mRes){
          if (mRes.error) throw mRes.error;

          // remap local ids to real uuids so future score edits patch the right rows
          var newScores = {};
          mRes.data.forEach(function(row, i){
            var origMatchId = flat[i].m.id;
            if (state.scores[origMatchId]) newScores[row.id] = state.scores[origMatchId];
          });
          state.scores = newScores;
          state.participants = state.participants.map(function(p){ return Object.assign({}, p, {id: idMap[p.id]}); });
          state.schedule = buildScheduleFromCloud(state.format, state.participants, mRes.data);
          state.champBracket = null;
          state.cloud = {tournamentId: tournamentId, editToken: editToken};
          state.readOnly = false;
          saveEditTokenLocally(tournamentId, editToken);
          try { history.replaceState(null, "", "#t=" + tournamentId + "&k=" + editToken); } catch(e){}
          setPublishStatus("done");
        });
      });
    }).catch(function(err){
      setPublishStatus("error", (err && err.message) ? err.message : "Gagal menyimpan ke server.");
    });
  }

  function loadFromCloud(tournamentId, editTokenFromHash){
    if (!sb){ setPublishStatus("error", "Koneksi ke server belum siap."); return; }
    setPublishStatus("loading");
    var editToken = editTokenFromHash || loadEditTokenLocally(tournamentId);
    Promise.all([
      sb.from("tournaments").select("id, name, event_date, location, courts, format, scoring, created_at").eq("id", tournamentId).single(),
      sb.from("pairs").select("*").eq("tournament_id", tournamentId).order("created_at"),
      sb.from("matches").select("*").eq("tournament_id", tournamentId).order("created_at")
    ]).then(function(results){
      var tRes = results[0], pRes = results[1], mRes = results[2];
      if (tRes.error || !tRes.data) throw (tRes.error || new Error("Turnamen tidak ditemukan."));
      if (pRes.error) throw pRes.error;
      if (mRes.error) throw mRes.error;

      var t = tRes.data;
      state.info = {name: t.name, date: t.event_date || "", location: t.location || "", courts: t.courts};
      state.format = t.format;
      state.scoring = t.scoring && Object.keys(t.scoring).length ? t.scoring : state.scoring;
      state.participants = pRes.data.map(function(r){ return {id: r.id, p1: r.player1, p2: r.player2, cat: r.category}; });
      state.isSample = false;

      state.scores = {};
      mRes.data.forEach(function(r){
        if (r.score_a !== null || r.score_b !== null){
          state.scores[r.id] = {a: r.score_a === null ? "" : String(r.score_a), b: r.score_b === null ? "" : String(r.score_b)};
        }
      });

      var champRows = mRes.data.filter(function(r){ return typeof r.round_label === "string" && r.round_label.indexOf("champ-") === 0; });
      var baseRows = mRes.data.filter(function(r){ return !(typeof r.round_label === "string" && r.round_label.indexOf("champ-") === 0); });
      state.schedule = buildScheduleFromCloud(state.format, state.participants, baseRows);

      var teamsById = {};
      state.participants.forEach(function(pt){ teamsById[pt.id] = pt; });
      var findChamp = function(label){
        var found = champRows.filter(function(r){ return r.round_label === label; });
        return found[0] || null;
      };
      var sf1r = findChamp("champ-sf1"), sf2r = findChamp("champ-sf2");
      var finalr = findChamp("champ-final"), thirdr = findChamp("champ-3rd");
      if (sf1r && sf2r){
        state.champBracket = {
          entities: [teamsById[sf1r.team_a_id], teamsById[sf1r.team_b_id], teamsById[sf2r.team_a_id], teamsById[sf2r.team_b_id]],
          sf: [
            {court: sf1r.court || 1, a: teamsById[sf1r.team_a_id], b: teamsById[sf1r.team_b_id], id: sf1r.id},
            {court: sf2r.court || 2, a: teamsById[sf2r.team_a_id], b: teamsById[sf2r.team_b_id], id: sf2r.id}
          ],
          final: finalr ? {court: finalr.court || 1, a: teamsById[finalr.team_a_id], b: teamsById[finalr.team_b_id], id: finalr.id} : null,
          third: thirdr ? {court: thirdr.court || 2, a: teamsById[thirdr.team_a_id], b: teamsById[thirdr.team_b_id], id: thirdr.id} : null
        };
      } else {
        state.champBracket = null;
      }
      // Ownership is decided purely by "do we have a token", never by reading one
      // back from the server — the tournaments row never exposes edit_token to a
      // plain select (see the column-level REVOKE in the DB), and the real check
      // happens server-side in update_match_score() on every write attempt anyway.
      var isOwner = !!editToken;
      state.cloud = {tournamentId: tournamentId, editToken: isOwner ? editToken : null};
      state.readOnly = !isOwner;
      if (isOwner) saveEditTokenLocally(tournamentId, editToken);
      state.step = STEPS.length - 1; // Klasemen
      setPublishStatus("idle");
    }).catch(function(err){
      setPublishStatus("error", (err && err.message) ? err.message : "Gagal memuat turnamen dari server.");
      renderAll();
    });
  }

  function copyShareLink(){
    var url = location.origin + location.pathname + "#t=" + state.cloud.tournamentId;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).catch(function(){});
    }
    return url;
  }

  function resetAll(){
    state.step = 0;
    state.info = {name:"", date:"", location:"", courts: 2};
    state.format = "round_robin";
    state.participants = [];
    state.nextId = 1;
    state.isSample = false;
    state.players = [];
    state.nextPlayerId = 1;
    state.isSamplePlayers = false;
    state.roundsCount = 4;
    state.teams = [];
    state.nextTeamId = 1;
    state.isSampleTeams = false;
    state.scoring = {bestOf:3, gamesPerSet:6, goldenPoint:true, superTiebreak:false};
    state.schedule = null;
    state.scores = {};
    state.editingMatch = null;
    state.champBracket = null;
    state.cloud = null;
    state.readOnly = false;
    state.publishStatus = "idle";
    state.publishError = "";
    try { history.replaceState(null, "", location.pathname); } catch(e){}
    renderAll();
  }

  var hashMatch = /t=([0-9a-fA-F-]{36})/.exec(location.hash || "");
  if (hashMatch){
    var keyMatch = /[&#]k=([0-9a-fA-F]{32})/.exec(location.hash || "");
    loadFromCloud(hashMatch[1], keyMatch ? keyMatch[1] : null);
  } else {
    renderAll();
  }
})();
</script>
