<meta name="claude:viewport-fit-sides" content="cover">
<title>Rally Draw</title>
<style>
/* ────────────────────────────────────────────────────────────
   Layout concept: a vertical "scorecard" wizard — one tab strip
   styled like a tournament scoreboard, one working panel below.
   Generated matches render as stacked court cards, each row
   reading left-to-right like a draw sheet pinned to a clipboard.
   ──────────────────────────────────────────────────────────── */
:root{
  --bg:#F6F4EC;
  --surface:#FFFFFF;
  --surface-2:#EFEBDF;
  --ink:#16261F;
  --ink-soft:#54645C;
  --court:#1F6F62;
  --court-dark:#133E36;
  --ball:#C9E24E;
  --ball-ink:#2B3309;
  --line:#DAD3C1;
  --danger:#B5432F;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A17;
    --surface:#15271F;
    --surface-2:#1C322A;
    --ink:#ECEEE3;
    --ink-soft:#A6B8AF;
    --court:#52B49C;
    --court-dark:#2C5A4E;
    --ball:#D7EE6C;
    --ball-ink:#20280A;
    --line:#2A3D34;
    --danger:#E6826A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A17;
  --surface:#15271F;
  --surface-2:#1C322A;
  --ink:#ECEEE3;
  --ink-soft:#A6B8AF;
  --court:#52B49C;
  --court-dark:#2C5A4E;
  --ball:#D7EE6C;
  --ball-ink:#20280A;
  --line:#2A3D34;
  --danger:#E6826A;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Work Sans",system-ui,-apple-system,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:28px 60px;
}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:720px;margin:0 auto}

/* header */
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--ball);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark svg{width:16px;height:16px}
.brand h1{font-size:1.4rem;color:var(--ink)}
.brand span{display:block;font-size:0.72rem;color:var(--ink-soft);font-weight:500;letter-spacing:0.04em;text-transform:uppercase;margin-top:1px}
.theme-note{font-size:0.72rem;color:var(--ink-soft)}

/* cloud / share status */
.cloud-badge{display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:0.03em}
.cloud-badge.online{background:color-mix(in srgb, var(--court) 20%, var(--surface-2));color:var(--court)}
.cloud-badge.offline{background:var(--surface-2);color:var(--ink-soft)}
.cloud-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.share-box{background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.share-box .link-field{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:0.78rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-box .label{font-size:0.78rem;color:var(--ink-soft);flex:0 0 100%}
.publish-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.publish-row .status-text{font-size:0.78rem;color:var(--ink-soft)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* step strip */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-btn{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:9px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-soft);font-size:0.82rem;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
}
.step-btn .num{
  width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-family:"IBM Plex Mono",monospace;flex-shrink:0;
}
.step-btn.active{background:var(--court);border-color:var(--court);color:#fff}
.step-btn.active .num{background:rgba(255,255,255,.22);color:#fff}
.step-btn.done .num{background:var(--court);color:#fff}
.step-btn:focus-visible{outline:2px solid var(--court);outline-offset:2px}

/* card */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:3px}
.panel .sub{color:var(--ink-soft);font-size:0.85rem;margin-bottom:18px}

/* form */
.field{margin-bottom:15px}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.01em}
.field input[type=text],.field input[type=date],.field input[type=number],.field select{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:0.92rem;font-family:inherit;
}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--court);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}

/* format picker */
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.fmt-grid{grid-template-columns:1fr}}
.fmt-card{
  border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;background:var(--bg);
  text-align:left;color:var(--ink);transition:border-color .15s,background .15s;
}
.fmt-card strong{display:block;font-size:0.9rem;margin-bottom:3px;font-family:"Archivo",sans-serif;font-weight:700}
.fmt-card span{font-size:0.78rem;color:var(--ink-soft);line-height:1.4}
.fmt-card.active{border-color:var(--court);background:color-mix(in srgb, var(--court) 10%, var(--bg))}
.fmt-card:focus-visible{outline:2px solid var(--court);outline-offset:2px}

/* participant list */
.add-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.add-row input,.add-row select{flex:1;min-width:120px}
.btn{
  border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:0.86rem;cursor:pointer;
  font-family:"Work Sans",sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-primary{background:var(--court);color:#fff}
.btn-primary:hover{background:var(--court-dark)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-ball{background:var(--ball);color:var(--ball-ink)}
.btn:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pair-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pair-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);
}
.pair-item .names{font-weight:600;font-size:0.88rem}
.pair-item .cat{font-size:0.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px}
.pair-item button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.78rem;font-weight:600;padding:4px 6px}
.empty{color:var(--ink-soft);font-size:0.85rem;padding:18px 0;text-align:center}

/* scoring */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .t-label{font-size:0.88rem;font-weight:600}
.toggle-row .t-desc{font-size:0.76rem;color:var(--ink-soft);margin-top:2px}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch .thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked ~ .track{background:var(--court)}
.switch input:checked ~ .thumb{transform:translateX(18px)}

/* schedule output */
.sched-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:0.8rem;color:var(--ink-soft)}
.sched-meta b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.round-block{margin-bottom:20px}
.round-title{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.round-title .chip{background:var(--court);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:0.72rem;padding:3px 9px;border-radius:999px;font-weight:600}
.round-title h3{font-size:0.98rem}
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.match-card{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
.match-card .court-tag{font-size:0.68rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.match-card .court-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ball)}
.vs-line{display:flex;align-items:center;gap:8px;font-size:0.85rem;font-weight:600}
.vs-line .vs{font-family:"IBM Plex Mono",monospace;color:var(--ink-soft);font-size:0.7rem;font-weight:500}
.bye-card{border-style:dashed;color:var(--ink-soft);font-size:0.8rem;display:flex;align-items:center;justify-content:center}

.note-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:0.82rem;color:var(--ink-soft);line-height:1.5;margin-bottom:16px}
.note-box b{color:var(--ink)}

/* score entry inside match cards */
.score-row{display:flex;align-items:center;gap:7px;font-size:0.85rem;font-weight:600}
.score-row .team-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-row .team-name.lead{color:var(--court)}
.score-input{
  width:34px;flex:0 0 auto;text-align:center;padding:5px 2px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:0.85rem;font-family:"IBM Plex Mono",monospace;font-weight:600;
  -moz-appearance:textfield;
}
.score-input::-webkit-outer-spin-button,.score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score-input:focus-visible{outline:2px solid var(--court);outline-offset:1px}
.score-sep{color:var(--ink-soft);font-size:0.72rem;flex:0 0 auto}
.match-card.has-result{border-color:color-mix(in srgb, var(--court) 45%, var(--line))}

/* standings table */
.standings-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.standings-table{width:100%;border-collapse:collapse;min-width:480px;font-size:0.85rem}
.standings-table th{
  text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);
  font-weight:700;padding:10px 12px;background:var(--surface-2);white-space:nowrap;
}
.standings-table th.num,.standings-table td.num{text-align:center}
.standings-table td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.standings-table td.pair-cell{white-space:normal;font-weight:600}
.standings-table tr:first-child td{border-top:none}
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  font-family:"IBM Plex Mono",monospace;font-size:0.76rem;font-weight:700;background:var(--surface-2);color:var(--ink-soft);
}
.rank-badge.r1{background:var(--ball);color:var(--ball-ink)}
.rank-badge.r2{background:color-mix(in srgb, var(--court) 28%, var(--surface-2));color:var(--ink)}
.rank-badge.r3{background:color-mix(in srgb, var(--court) 14%, var(--surface-2));color:var(--ink)}
.diff-pos{color:var(--court)}
.diff-neg{color:var(--danger)}
.group-heading{font-size:1rem;margin:20px 0 9px}
.group-heading:first-child{margin-top:0}

/* nav */
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.sample-tag{display:inline-block;background:var(--ball);color:var(--ball-ink);font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
footer{text-align:center;font-size:0.72rem;color:var(--ink-soft);margin-top:30px}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<div class="wrap">
  <div class="masthead">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="#2B3309" stroke-width="2"/><path d="M4 9c4 2 12 2 16 0M4 15c4-2 12-2 16 0" stroke="#2B3309" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>Rally Draw</h1>
        <span>Penyusun turnamen padel</span>
      </div>
    </div>
    <div id="cloud-status"></div>
  </div>

  <div class="steps" id="steps" role="tablist" aria-label="Langkah penyusunan turnamen"></div>
  <div id="panel-host"></div>

  <footer>Dibuat dengan Rally Draw &middot; data tersimpan hanya di perangkat ini</footer>
</div>

<script>
(function(){
  "use strict";

  var STEPS = [
    {id:"info", label:"Info"},
    {id:"format", label:"Format"},
    {id:"peserta", label:"Peserta"},
    {id:"skor", label:"Skor"},
    {id:"jadwal", label:"Jadwal"},
    {id:"klasemen", label:"Klasemen"}
  ];

  var FORMATS = {
    round_robin:{
      name:"Round Robin",
      desc:"Semua pasangan saling bertanding satu kali. Cocok untuk peserta sedikit dan ingin jam main merata."
    },
    knockout:{
      name:"Gugur Langsung",
      desc:"Kalah satu kali langsung tersingkir. Bagan menyusut tiap babak hingga tersisa satu juara."
    },
    groups_knockout:{
      name:"Grup + Gugur",
      desc:"Peserta dibagi grup kecil untuk round robin, lalu grup teratas lanjut ke babak gugur."
    },
    mexicano:{
      name:"Mexicano",
      desc:"Format dinamis khas padel: pasangan diacak ulang tiap babak berdasarkan perolehan poin."
    }
  };

  var state = {
    step: 0,
    info: {
      name: "Turnamen Komunitas Minggu Pagi",
      date: nextSunday(),
      location: "GOR Rawa Padel, Jakarta Selatan",
      courts: 3
    },
    format: "round_robin",
    nameInput: "",
    catInput: "Terbuka",
    participants: [
      {id:1, p1:"Dimas", p2:"Reza", cat:"Terbuka"},
      {id:2, p1:"Nadia", p2:"Citra", cat:"Terbuka"},
      {id:3, p1:"Bagus", p2:"Fajar", cat:"Terbuka"},
      {id:4, p1:"Wulan", p2:"Intan", cat:"Terbuka"},
      {id:5, p1:"Yoga", p2:"Arka", cat:"Pemula"},
      {id:6, p1:"Lani", p2:"Sari", cat:"Pemula"}
    ],
    nextId: 7,
    scoring: {
      bestOf: 3,
      gamesPerSet: 6,
      goldenPoint: true,
      superTiebreak: false
    },
    schedule: null,
    isSample: true,
    scores: {},
    cloud: null,
    publishStatus: "idle",
    publishError: ""
  };

  var SUPABASE_URL = "https://hxzazdpknudfbwicjdol.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_z1AjIxD7cTT0bb6lgXRtLA_OBlImc4m";
  var sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  function nextSunday(){
    var d = new Date();
    var day = d.getDay();
    var add = (7 - day) % 7 || 7;
    d.setDate(d.getDate() + add);
    return d.toISOString().slice(0,10);
  }

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function fmtDate(iso){
    if (!iso) return "-";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  }

  // ---------- rendering ----------

  function renderSteps(){
    var host = document.getElementById("steps");
    host.innerHTML = "";
    STEPS.forEach(function(s, i){
      var cls = "step-btn";
      if (i === state.step) cls += " active";
      else if (i < state.step) cls += " done";
      var btn = el("button", {
        class: cls, type:"button", role:"tab",
        "aria-selected": i === state.step ? "true" : "false",
        onclick: function(){ goStep(i); }
      }, [
        el("span", {class:"num"}, [String(i+1)]),
        s.label
      ]);
      host.appendChild(btn);
    });
  }

  function goStep(i){
    state.step = i;
    renderAll();
  }

  function renderCloudBadge(){
    var host = document.getElementById("cloud-status");
    if (!host) return;
    host.innerHTML = "";
    if (state.cloud && state.cloud.tournamentId){
      host.appendChild(el("span", {class:"cloud-badge online"}, [el("span", {class:"dot"}), "Online · tersimpan"]));
    } else {
      host.appendChild(el("span", {class:"cloud-badge offline"}, [el("span", {class:"dot"}), "Draf lokal"]));
    }
  }

  function renderAll(){
    renderSteps();
    renderCloudBadge();
    var host = document.getElementById("panel-host");
    host.innerHTML = "";

    if (state.publishStatus === "loading"){
      var loadingPanel = el("div", {class:"panel"}, [
        el("div", {style:"display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:0.9rem"}, [
          el("span", {class:"spinner"}), "Memuat turnamen dari server…"
        ])
      ]);
      host.appendChild(loadingPanel);
      return;
    }

    var id = STEPS[state.step].id;
    if (id === "info") host.appendChild(panelInfo());
    if (id === "format") host.appendChild(panelFormat());
    if (id === "peserta") host.appendChild(panelPeserta());
    if (id === "skor") host.appendChild(panelSkor());
    if (id === "jadwal") host.appendChild(panelJadwal());
    if (id === "klasemen") host.appendChild(panelKlasemen());
  }

  function navRow(prevLabel, nextLabel, onNext){
    var row = el("div", {class:"nav-row"});
    var prevBtn = el("button", {
      class:"btn btn-ghost", type:"button",
      onclick: function(){ if (state.step > 0){ state.step--; renderAll(); } }
    }, [prevLabel || "Kembali"]);
    if (state.step === 0) prevBtn.disabled = true;
    var nextBtn = el("button", {
      class:"btn btn-primary", type:"button",
      onclick: function(){
        if (onNext) onNext();
        if (state.step < STEPS.length - 1){ state.step++; renderAll(); }
      }
    }, [nextLabel || "Lanjut"]);
    row.appendChild(prevBtn);
    row.appendChild(nextBtn);
    return row;
  }

  // ---------- step 1: info ----------

  function panelInfo(){
    var p = el("div", {class:"panel"});
    p.appendChild(el("h2", {}, ["Info turnamen"]));
    p.appendChild(el("div", {class:"sub"}, ["Nama acara, tanggal, dan jumlah lapangan yang tersedia."]));

    var fName = field("Nama turnamen", "text", state.info.name, function(v){ state.info.name = v; });
    p.appendChild(fName);

    var row = el("div", {class:"row2"});
    row.appendChild(field("Tanggal", "date", state.info.date, function(v){ state.info.date = v; }));
    row.appendChild(field("Jumlah lapangan", "number", state.info.courts, function(v){ state.info.courts = Math.max(1, parseInt(v,10) || 1); }, {min:1, max:20}));
    p.appendChild(row);

    p.appendChild(field("Lokasi", "text", state.info.location, function(v){ state.info.location = v; }));

    p.appendChild(navRow("Kembali", "Lanjut ke Format"));
    return p;
  }

  function field(label, type, value, onChange, extraAttrs){
    var wrap = el("div", {class:"field"});
    wrap.appendChild(el("label", {}, [label]));
    var attrs = Object.assign({type:type, value:value}, extraAttrs || {});

  // ---------- scheduling engine ----------

  function teamLabel(t){ return t.p1 + "/" + t.p2; }

  // Round-robin via circle method, teams assigned to courts cyclically per round.
  function roundRobinRounds(teams){
    var list = teams.slice();
    var bye = null;
    if (list.length % 2 === 1){ bye = {id:"bye", p1:"—", p2:"", cat:""}; list.push(bye); }
    var n = list.length;
    var rounds = [];
    var arr = list.slice();
    for (var r = 0; r < n - 1; r++){
      var pairs = [];
      for (var i = 0; i < n/2; i++){
        var a = arr[i], b = arr[n-1-i];
        pairs.push([a,b]);
      }
      rounds.push(pairs);
      // rotate, keep first fixed
      var fixed = arr[0];
      var rest = arr.slice(1);
      rest.unshift(rest.pop());
      arr = [fixed].concat(rest);
    }
    return rounds;
  }

  function assignCourts(pairs, courts, roundLabel){
    // returns array of {court, a, b, id} dropping/flagging byes, cycling courts, queuing overflow into session groups
    var real = pairs.filter(function(pr){ return pr[0].id !== "bye" && pr[1].id !== "bye"; });
    var byeTeam = null;
    pairs.forEach(function(pr){
      if (pr[0].id === "bye") byeTeam = pr[1];
      if (pr[1].id === "bye") byeTeam = pr[0];
    });
    var sessions = [];
    for (var i = 0; i < real.length; i += courts){
      var chunk = real.slice(i, i + courts).map(function(pr, idx){
        var mid = (roundLabel || "r") + ":" + [pr[0].id, pr[1].id].sort().join("-");
        return {court: idx+1, a: pr[0], b: pr[1], id: mid};
      });
      sessions.push(chunk);
    }
    if (sessions.length === 0) sessions.push([]);
    return {sessions: sessions, bye: byeTeam};
  }

  function flattenMatches(sessions){
    var out = [];
    sessions.forEach(function(s){ s.forEach(function(m){ out.push(m); }); });
    return out;
  }

  function buildKnockout(teams){
    var list = teams.slice();
    // simple shuffle-free seed order as entered
    var size = 1;
    while (size < list.length) size *= 2;
    while (list.length < size) list.push({id:"bye", p1:"BYE", p2:"", cat:""});
    var rounds = [];
    var roundNames = function(remaining){
      if (remaining === 2) return "Final";
      if (remaining === 4) return "Semifinal";
      if (remaining === 8) return "Perempat Final";
      return "Babak " + Math.round(size/remaining);
    };
    var current = list;
    while (current.length >= 2){
      var pairs = [];
      for (var i = 0; i < current.length; i += 2){
        pairs.push([current[i], current[i+1]]);
      }
      rounds.push({name: roundNames(current.length), pairs: pairs});
      current = pairs.map(function(){ return {id:"tbd", p1:"Pemenang", p2:"", cat:""}; });
    }
    return rounds;
  }

  function buildGroups(teams, groupSize){
    var groups = [];
    var list = teams.slice();
    var count = Math.max(1, Math.ceil(list.length / groupSize));
    for (var i = 0; i < count; i++) groups.push([]);
    list.forEach(function(t, idx){ groups[idx % count].push(t); });
    return groups;
  }

  function buildSchedule(){
    var teams = state.participants.slice();
    var courts = state.info.courts;
    if (teams.length < 2) return {error:"need2"};

    if (state.format === "round_robin"){
      var rounds = roundRobinRounds(teams);
      var rrRounds = rounds.map(function(pairs, i){
        var out = assignCourts(pairs, courts, "rr-r" + (i+1));
        return {label:"Babak " + (i+1), sessions: out.sessions, bye: out.bye};
      });
      var rrMatches = [];
      rrRounds.forEach(function(r){ rrMatches = rrMatches.concat(flattenMatches(r.sessions)); });
      return {type:"round_robin", rounds: rrRounds, teams: teams, matches: rrMatches};
    }

    if (state.format === "knockout"){
      var kr = buildKnockout(teams);
      return {type:"knockout", rounds: kr};
    }

    if (state.format === "groups_knockout"){
      var groups = buildGroups(teams, 4);
      var groupData = groups.map(function(g, gi){
        var rounds2 = roundRobinRounds(g);
        var gRounds = rounds2.map(function(pairs, i){
          var out = assignCourts(pairs, courts, "g" + gi + "-r" + (i+1));
          return {label:"Babak " + (i+1), sessions: out.sessions, bye: out.bye};
        });
        var gMatches = [];
        gRounds.forEach(function(r){ gMatches = gMatches.concat(flattenMatches(r.sessions)); });
        return {
          name: "Grup " + String.fromCharCode(65+gi),
          teams: g,
          rounds: gRounds,
          matches: gMatches
        };
      });
      return {type:"groups_knockout", groups: groupData};
    }

    if (state.format === "mexicano"){
      // round 1 only: pair by entry order, rest depends on live scores
      var shuffled = teams.slice();
      var pairs1 = [];
      for (var i = 0; i < shuffled.length - 1; i += 2) pairs1.push([shuffled[i], shuffled[i+1]]);
      var byeM = shuffled.length % 2 === 1 ? shuffled[shuffled.length-1] : null;
      var out1 = assignCourts(byeM ? pairs1.concat([[shuffled[shuffled.length-1], {id:"bye",p1:"—",p2:""}]]) : pairs1, courts, "mex-r1");
      return {type:"mexicano", firstRound: out1, teams: teams, matches: flattenMatches(out1.sessions)};
    }

    return {error:"unknown"};
  }

  function matchCard(m){
    var a = m.a, b = m.b, hasId = !!m.id;
    var sc = (hasId && state.scores[m.id]) || {};

    card.appendChild(el("div", {class:"court-tag"}, ["Lapangan " + m.court]));

      ]));

    var row = el("div", {class:"score-row"});

    if (sc.a !== undefined) inputA.value = sc.a;
    inputA.addEventListener("change", function(){ setScore(m.id, "a", inputA.value); });
    row.appendChild(inputA);
    row.appendChild(el("span", {class:"score-sep"}, [":"]));

    inputB.addEventListener("change", function(){ setScore(m.id, "b", inputB.value); });

    row.appendChild(el("span", {class:"team-name"}, [teamLabel(b)]));

  function setScore(matchId, side, value){
    if (!state.scores[matchId]) state.scores[matchId] = {};
    state.scores[matchId][side] = value;
    renderAll();
    if (state.cloud && state.cloud.tournamentId && sb){
      var sc = state.scores[matchId];
      var payload = {};
      payload[side === "a" ? "score_a" : "score_b"] = (sc[side] === "" ? null : parseInt(sc[side], 10));
      sb.from("matches").update(payload).eq("id", matchId).then(function(res){
        if (res.error) console.warn("Gagal menyimpan skor ke server:", res.error.message);
      });
    }
  }

  // ---------- standings ----------

  function computeStandings(teams, matches){
    var table = {};
    teams.forEach(function(t){
      if (t.id === "bye") return;
      table[t.id] = {team:t, played:0, win:0, loss:0, tie:0, gf:0, ga:0};
    });
    (matches || []).forEach(function(m){
      var sc = state.scores[m.id];
      if (!sc || sc.a === undefined || sc.b === undefined || sc.a === "" || sc.b === "") return;
      var sa = parseInt(sc.a, 10), sb = parseInt(sc.b, 10);
      if (isNaN(sa) || isNaN(sb)) return;
      var ra = table[m.a.id], rb = table[m.b.id];
      if (!ra || !rb) return;
      ra.played++; rb.played++;
      ra.gf += sa; ra.ga += sb;
      rb.gf += sb; rb.ga += sa;
      if (sa > sb){ ra.win++; rb.loss++; }
      else if (sb > sa){ rb.win++; ra.loss++; }
      else { ra.tie++; rb.tie++; }
    });
    var rows = Object.keys(table).map(function(k){ return table[k]; });
    rows.sort(function(x, y){
      if (y.win !== x.win) return y.win - x.win;
      var dx = x.gf - x.ga, dy = y.gf - y.ga;
      if (dy !== dx) return dy - dx;
      return y.gf - x.gf;
    });
    return rows;
  }

  function standingsTable(teams, matches){
    var rows = computeStandings(teams, matches);
    var wrap = el("div", {class:"standings-wrap"});

      ])
    ]);
    var tbody = el("tbody");
    rows.forEach(function(r, i){
      var rankCls = "rank-badge" + (i === 0 ? " r1" : i === 1 ? " r2" : i === 2 ? " r3" : "");
      var diff = r.gf - r.ga;
      var diffCls = diff > 0 ? "diff-pos" : diff < 0 ? "diff-neg" : "";
      var diffText = (diff > 0 ? "+" : "") + diff;
      tbody.appendChild(el("tr", {}, [
        el("td", {class:"num"}, [el("span", {class:rankCls}, [String(i+1)])]),
        el("td", {class:"pair-cell"}, [teamLabel(r.team)]),
        el("td", {class:"num mono"}, [String(r.played)]),
        el("td", {class:"num mono"}, [r.win + "-" + r.loss]),
        el("td", {class:"num mono"}, [r.gf + ":" + r.ga]),
        el("td", {class:"num mono " + diffCls}, [diffText])
      ]));
    });
    if (rows.length === 0){
      tbody.appendChild(el("tr", {}, [el("td", {colspan:"6", class:"empty"}, ["Belum ada pasangan."])]));
    }
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

      ]));
    } else if (s.type === "groups_knockout"){
      s.groups.forEach(function(g){
        p.appendChild(el("h3", {class:"group-heading"}, [g.name]));
        p.appendChild(standingsTable(g.teams, g.matches));
      });
    } else if (s.type === "mexicano"){
      p.appendChild(standingsTable(s.teams, s.matches));
      p.appendChild(el("div", {class:"note-box"}, [
        el("b", {}, ["Klasemen sementara. "]), "Baru mencakup babak 1 — babak berikutnya disusun manual di lapangan berdasarkan klasemen ini."
      ]));
    } else if (s.type === "knockout"){
      p.appendChild(el("div", {class:"empty"}, ["Klasemen tidak berlaku untuk format gugur langsung — ikuti bagan di tahap Jadwal."]));
    }

    var nav = el("div", {class:"nav-row"});
    nav.appendChild(el("button", {class:"btn btn-ghost", type:"button", onclick:function(){ state.step = 4; renderAll(); }}, ["Kembali ke Jadwal"]));
    nav.appendChild(el("button", {class:"btn btn-primary", type:"button", onclick:resetAll}, ["Turnamen Baru"]));
    p.appendChild(nav);
    return p;
  }

  // ---------- cloud sync (Supabase) ----------

  function groupBy(arr, keyFn){
    var m = {};
    arr.forEach(function(x){ var k = keyFn(x); (m[k] = m[k] || []).push(x); });
    return m;
  }

  function roundSortKey(label){
    var m = /r(\d+)$/.exec(label || "");
    return m ? parseInt(m[1], 10) : 0;
  }

  function rowsToRounds(rows, teamsById){
    var byRound = groupBy(rows, function(r){ return r.round_label; });
    var labels = Object.keys(byRound).sort(function(a, b){ return roundSortKey(a) - roundSortKey(b); });
    return labels.map(function(rl, i){
      var matches = byRound[rl].map(function(r){
        return {court: r.court, a: teamsById[r.team_a_id], b: teamsById[r.team_b_id], id: r.id};
      }).sort(function(x, y){ return x.court - y.court; });
      return {label: "Babak " + (i + 1), sessions: [matches], bye: null};
    });
  }

  function buildScheduleFromCloud(format, teams, matchesRows){
    var teamsById = {};
    teams.forEach(function(t){ teamsById[t.id] = t; });
    var withTeams = function(r){ return {court: r.court, a: teamsById[r.team_a_id], b: teamsById[r.team_b_id], id: r.id}; };

    if (format === "round_robin"){
      return {
        type: "round_robin",
        rounds: rowsToRounds(matchesRows, teamsById),
        teams: teams,
        matches: matchesRows.map(withTeams)
      };
    }
    if (format === "mexicano"){
      var sessions = [matchesRows.map(withTeams)];
      return {type: "mexicano", firstRound: {sessions: sessions, bye: null}, teams: teams, matches: flattenMatches(sessions)};
    }
    if (format === "groups_knockout"){
      var byGroup = groupBy(matchesRows, function(r){ return r.group_name || "Grup A"; });
      var groupNames = Object.keys(byGroup).sort();
      var groups = groupNames.map(function(gn){
        var rows = byGroup[gn];
        var ids = {};
        rows.forEach(function(r){ ids[r.team_a_id] = 1; ids[r.team_b_id] = 1; });
        var groupTeams = teams.filter(function(t){ return ids[t.id]; });
        return {name: gn, teams: groupTeams, rounds: rowsToRounds(rows, teamsById), matches: rows.map(withTeams)};
      });
      return {type: "groups_knockout", groups: groups};
    }
    return {error: "unsupported"};
  }

  function setPublishStatus(status, msg){
    state.publishStatus = status;
    state.publishError = msg || "";
    renderAll();
  }

  function publishToCloud(){
    if (!sb){
      setPublishStatus("error", "Koneksi ke server belum siap. Coba muat ulang halaman.");
      return;
    }
    if (!state.schedule) state.schedule = buildSchedule();
    var s = state.schedule;
    if (s.error){
      setPublishStatus("error", "Lengkapi peserta dan buat jadwal terlebih dahulu.");
      return;
    }
    if (s.type === "knockout"){
      setPublishStatus("error", "Format Gugur Langsung belum didukung untuk disimpan online.");
      return;
    }

    setPublishStatus("saving");

    sb.from("tournaments").insert([{
      name: state.info.name || "Turnamen Padel",
      event_date: state.info.date || null,
      location: state.info.location || null,
      courts: state.info.courts,
      format: state.format,
      scoring: state.scoring
    }]).select().then(function(tRes){
      if (tRes.error) throw tRes.error;
      var tournamentId = tRes.data[0].id;

      var pairsPayload = state.participants.map(function(p){
        return {tournament_id: tournamentId, player1: p.p1, player2: p.p2, category: p.cat};
      });
      return sb.from("pairs").insert(pairsPayload).select().then(function(pRes){
        if (pRes.error) throw pRes.error;
        var idMap = {};
        state.participants.forEach(function(p, i){ idMap[p.id] = pRes.data[i].id; });

        var flat = [];
        if (s.type === "round_robin" || s.type === "mexicano"){
          s.matches.forEach(function(m){ flat.push({groupName: null, m: m}); });
        } else if (s.type === "groups_knockout"){
          s.groups.forEach(function(g){ g.matches.forEach(function(m){ flat.push({groupName: g.name, m: m}); }); });
        }

        var matchesPayload = flat.map(function(x){
          var sc = state.scores[x.m.id] || {};
          var sa = sc.a !== undefined && sc.a !== "" ? parseInt(sc.a, 10) : null;
          var sb_ = sc.b !== undefined && sc.b !== "" ? parseInt(sc.b, 10) : null;
          return {
            tournament_id: tournamentId,
            group_name: x.groupName,
            round_label: (x.m.id || "r1").split(":")[0],
            court: x.m.court,
            team_a_id: idMap[x.m.a.id],
            team_b_id: idMap[x.m.b.id],
            score_a: isNaN(sa) ? null : sa,
            score_b: isNaN(sb_) ? null : sb_
          };
        });

        return sb.from("matches").insert(matchesPayload).select().then(function(mRes){
          if (mRes.error) throw mRes.error;

          // remap local ids to real uuids so future score edits patch the right rows
          var newScores = {};
          mRes.data.forEach(function(row, i){
            var origMatchId = flat[i].m.id;
            if (state.scores[origMatchId]) newScores[row.id] = state.scores[origMatchId];
          });
          state.scores = newScores;
          state.participants = state.participants.map(function(p){ return Object.assign({}, p, {id: idMap[p.id]}); });
          state.schedule = buildScheduleFromCloud(state.format, state.participants, mRes.data);
          state.cloud = {tournamentId: tournamentId};
          try { history.replaceState(null, "", "#t=" + tournamentId); } catch(e){}
          setPublishStatus("done");
        });
      });
    }).catch(function(err){
      setPublishStatus("error", (err && err.message) ? err.message : "Gagal menyimpan ke server.");
    });
  }

  function loadFromCloud(tournamentId){
    if (!sb){ setPublishStatus("error", "Koneksi ke server belum siap."); return; }
    setPublishStatus("loading");
    Promise.all([
      sb.from("tournaments").select("*").eq("id", tournamentId).single(),
      sb.from("pairs").select("*").eq("tournament_id", tournamentId).order("created_at"),
      sb.from("matches").select("*").eq("tournament_id", tournamentId).order("created_at")
    ]).then(function(results){
      var tRes = results[0], pRes = results[1], mRes = results[2];
      if (tRes.error || !tRes.data) throw (tRes.error || new Error("Turnamen tidak ditemukan."));
      if (pRes.error) throw pRes.error;
      if (mRes.error) throw mRes.error;

      var t = tRes.data;
      state.info = {name: t.name, date: t.event_date || "", location: t.location || "", courts: t.courts};
      state.format = t.format;
      state.scoring = t.scoring && Object.keys(t.scoring).length ? t.scoring : state.scoring;
      state.participants = pRes.data.map(function(r){ return {id: r.id, p1: r.player1, p2: r.player2, cat: r.category}; });
      state.isSample = false;

      state.scores = {};
      mRes.data.forEach(function(r){
        if (r.score_a !== null || r.score_b !== null){
          state.scores[r.id] = {a: r.score_a === null ? "" : String(r.score_a), b: r.score_b === null ? "" : String(r.score_b)};
        }
      });

      state.schedule = buildScheduleFromCloud(state.format, state.participants, mRes.data);
      state.cloud = {tournamentId: tournamentId};
      state.step = STEPS.length - 1; // Klasemen
      setPublishStatus("idle");
    }).catch(function(err){
      setPublishStatus("error", (err && err.message) ? err.message : "Gagal memuat turnamen dari server.");
      renderAll();
    });
  }

  function copyShareLink(){
    var url = location.origin + location.pathname + "#t=" + state.cloud.tournamentId;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).catch(function(){});
    }
    return url;
  }

  function resetAll(){
    state.step = 0;
    state.info = {name:"", date:"", location:"", courts: 2};
    state.format = "round_robin";
    state.participants = [];
    state.nextId = 1;
    state.scoring = {bestOf:3, gamesPerSet:6, goldenPoint:true, superTiebreak:false};
    state.schedule = null;
    state.isSample = false;
    state.scores = {};
    state.cloud = null;
    state.publishStatus = "idle";
    state.publishError = "";
    try { history.replaceState(null, "", location.pathname); } catch(e){}
    renderAll();
  }

  var hashMatch = /t=([0-9a-fA-F-]{36})/.exec(location.hash || "");
  if (hashMatch){
    loadFromCloud(hashMatch[1]);
  } else {
    renderAll();
  }
})();
</script>
